name: pixelvyne

services:
  app-db:                      # platform metadata: projects, files, jobs, IR, results
    image: postgres:16
    environment:
      POSTGRES_USER: pixelvyne
      POSTGRES_PASSWORD: pixelvyne
      POSTGRES_DB: pixelvyne
    ports: ["5432:5432"]
    volumes: [app_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelvyne -d pixelvyne"]
      interval: 5s
      retries: 20

  target-db:                   # sandbox where converted code runs; safe to wipe
    image: postgres:16
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: target
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d target"]
      interval: 5s
      retries: 20

  oracle:                      # the legacy source system
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: legacy
      APP_USER_PASSWORD: legacy
    ports: ["1521:1521"]
    volumes: [oracle_data:/opt/oracle/oradata]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/code]
    depends_on:
      app-db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: celery -A app.worker:celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    volumes: [./backend:/code]
    depends_on:
      app-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      target-db: { condition: service_healthy }
      oracle: { condition: service_healthy }

volumes:
  app_db_data:
  oracle_data:
